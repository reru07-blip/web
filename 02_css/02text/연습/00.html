<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이콘 폰트</title>
  <style>
    ul{
      list-style-type: none;
      text-align: left;
    }
    .user_id{
      text-align: left;
    }
    .this_id{
      border-spacing: 100px;
    }
  </style>
</head>

<body>
  <form>
    <h2>회원 가입을 환영 합니다</h2>
    <fieldset>
      <legend>사용자 정보</legend>
      <ul>
        <li>
          <label for="user_id">아이디</label>
          <input type="text" class="this_id" id="user_id" autofocus placeholder="4자 ~ 10자 사이, 공백 없이">
        </li>

        <li>
          <label for="mail">이메일</label>
          <input type="email" id="mail">
        </li>

        <li>
          <label>비밀번호</label>
          <input type="text" placeholder="문자와 숫자, 특수 기호 포함">
        </li>

        <li>
          <label></label>
        </li>

        <li>
          <label></label>
        </li>

        <li>
          <label></label>
        </li>

      </ul>
    </fieldset>
  </form>
</body>

</html>
