<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설명 목록</title>
</head>
<body>
  <!-- 제목과 그에 대한 설명으로 이루어진 목록입니다 -->
  <!-- <dl>과 <dt><dd> 태그 사용 -->
  <!-- 하나의 dt에 여러개의 dd 값을 가질 수 있다 -->
  <h2>설명목록</h2>
  <dl>
    <dt>제목1
      <dd>설명1</dd>
      <dd>설명2</dd>
      <dd>설명3</dd>
    </dt>
    <dt>제목2
      <dd>설명1</dd>
      <dd>설명2</dd>
      <dd>설명3</dd>
    </dt>
  </dl>
</body>
</html>
