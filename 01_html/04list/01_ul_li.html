<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순서가 없는 목록</title>
  <style>
    ul{
      list-style: decimal;
    }
    ul{
      list-style: disc;
    }
  </style>
</head>
<body>
  <ul>
    <li>귤</li>
    <li>블루베리</li>
    <li>오렌지</li>
    <li>사과</li>
  </ul>
  <ol>
    <li>귤</li>
    <li>블루베리</li>
    <li>오렌지</li>
    <li>사과</li>
  </ol>
</body>
</html>
