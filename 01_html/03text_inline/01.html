<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>텍스트 인라인 묶기</title>
  <style>
    h2 {
      font-weight: 400;
      font-size: 16px;
    }

    p {
      background: #ccc;
    }

    strong {
      background: greenyellow;
      font-weight: normal;
    }

    b {
      background: pink;
      font-weight: 400;
    }
  </style>
</head>

<body>
  <h2>h2 : 제목태그 - 블록레벨</h2>
  <p>
    <strong>strong 태그 : 중요한 내용이라서 강조해야 할 때 , </strong>
    <b>b 태그 : 단순히 굵게 표시할 때</b>
  </p>
</body>

</html>
